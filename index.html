<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breath Artist — 呼吸法サポートアプリ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ===== 入力画面 ===== -->
  <section id="input-screen" class="screen active">
    <div class="container">
      <header class="app-header">
        <h1 class="app-title">Breath Artist</h1>
        <p class="app-subtitle">心と脳を調える呼吸法</p>
      </header>

      <form id="breath-form" autocomplete="off">
        <!-- 今の気持ち（Before） -->
        <div class="form-group">
          <label for="before-text">
            <span class="label-icon">🌙</span>
            今の気持ち（Before）
          </label>
          <div class="input-with-mic">
            <textarea id="before-text" rows="3" placeholder="今のあなたの気持ちを自由に書いてください..."></textarea>
            <button type="button" class="mic-btn" data-target="before-text" aria-label="音声入力">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- ありたい状態（After） -->
        <div class="form-group">
          <label for="after-text">
            <span class="label-icon">✨</span>
            ありたい状態（After）
          </label>
          <div class="input-with-mic">
            <textarea id="after-text" rows="3" placeholder="呼吸の後、どんな状態でありたいですか..."></textarea>
            <button type="button" class="mic-btn" data-target="after-text" aria-label="音声入力">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- 価値観選択 -->
        <div class="form-group">
          <label>
            <span class="label-icon">💎</span>
            大事にしている価値観（3つ選択）
            <span id="values-count" class="values-count">0 / 3</span>
          </label>
          <div id="values-grid" class="values-grid">
            <!-- js/form.js で動的生成 -->
          </div>
        </div>

        <!-- 呼吸設定 -->
        <div class="form-row">
          <div class="form-group half">
            <label for="rhythm-select">
              <span class="label-icon">🫁</span>
              呼吸のリズム
            </label>
            <select id="rhythm-select">
              <option value="3">3秒（吐3秒・吸3秒）</option>
              <option value="6" selected>6秒（吐6秒・吸6秒）</option>
              <option value="9">9秒（吐9秒・吸9秒）</option>
            </select>
          </div>
          <div class="form-group half">
            <label for="duration-select">
              <span class="label-icon">⏱️</span>
              呼吸の時間
            </label>
            <select id="duration-select">
              <option value="60">1分</option>
              <option value="180" selected>3分</option>
              <option value="300">5分</option>
            </select>
          </div>
        </div>

        <!-- 開始ボタン -->
        <button type="submit" id="start-btn" class="start-btn" disabled>
          呼吸セッション開始
        </button>
      </form>
    </div>
  </section>

  <!-- ===== 呼吸セッション画面 ===== -->
  <section id="session-screen" class="screen">
    <canvas id="geometry-canvas"></canvas>
    <div id="session-overlay" class="session-overlay">
      <div id="breath-phase" class="breath-phase">吐く</div>
      <div id="breath-countdown" class="breath-countdown">6</div>
      <div id="total-timer" class="total-timer">
        <div id="timer-bar" class="timer-bar"></div>
        <span id="timer-text" class="timer-text">3:00</span>
      </div>
    </div>
  </section>

  <!-- ===== 完了画面 ===== -->
  <section id="complete-screen" class="screen">
    <div class="container complete-container">
      <h2 class="complete-title">お疲れさまでした</h2>
      <p class="complete-subtitle">あなたの呼吸アートが完成しました</p>
      <div id="art-wrapper" class="art-wrapper">
        <canvas id="art-canvas" width="1080" height="1080"></canvas>
      </div>
      <div class="complete-actions">
        <button id="download-btn" class="action-btn primary-btn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
          </svg>
          画像を保存
        </button>
        <button id="retry-btn" class="action-btn secondary-btn">
          もう一度
        </button>
      </div>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
